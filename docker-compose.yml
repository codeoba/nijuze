version: '3.8'

services:
  # Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - nijuze-network
    restart: unless-stopped

  # Backend (Node.js + Express API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_USER=nijuze_user
      - DB_PASSWORD=nijuze_password
      - DB_NAME=nijuze
      - JWT_SECRET=${JWT_SECRET:-nijuze_super_secret_production_jwt_key_2026}
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nijuze-network
    restart: unless-stopped

  # MySQL 8.0 Database
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=nijuze
      - MYSQL_USER=nijuze_user
      - MYSQL_PASSWORD=nijuze_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/mysql_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nijuze-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  nijuze-network:
    driver: bridge
